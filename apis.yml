aid: leland
name: Leland
description: 'Leland is a marketplace for ambitious people to access the coaching,
  classes, and community they need to reach career and educational goals. It connects
  individuals with vetted 1-on-1 coaches across MBA and college admissions, management
  consulting, investment banking, private equity, product management, law, medicine,
  and executive and career development, and sells structured live programs, bootcamps,
  and test prep for the GMAT, GRE, LSAT, MCAT, SAT, and ACT. Leland+ is a subscription
  content library of video guides, essay and resume examples, templates, and expert-built
  AI tools. For organizations Leland offers AI-native talent training, agentic workflow
  deployment, recruiting, and outplacement, plus university and HR partnerships. Leland
  publishes no public API or developer portal as of 2026-07-19.'
